[package]
name = "identisure-client"
version = "0.1.0"
edition = "2024"
description = "API client for the Identisure REST API"
license = "MIT"
readme = "README.md"
homepage = "https://developers.identisure.com"
repository = "https://github.com/identisure/api-client-rust"
documentation = "https://docs.rs/identisure-client"
keywords = ["bankid", "eid", "identity", "authentication"]
categories = ["authentication", "web-programming::http-client", "api-bindings"]
rust-version = "1.87"
include = ["/src", "/LICENSE", "/README.md"]

[features]
default = ["async"]
async = ["dep:tokio"]
blocking = ["reqwest/blocking"]

[dependencies]
base64 = "0.23"
chrono = { version = "0.4", features = ["serde"] }
email_address = "0.2"
hmac = "0.13"
reqwest = { version = "0.13", features = ["json", "multipart"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_path_to_error = "0.1"
sha2 = "0.11"
thiserror = "2"
tokio = { version = "1", features = ["time", "macros"], optional = true }
url = "2"

[dev-dependencies]
tokio = { version = "1", features = ["rt", "macros"] }
